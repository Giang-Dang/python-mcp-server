<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shop query plan</title>
<style>
:root{color-scheme:light dark;--bg:#f7f8fa;--surface:#fff;--text:#202b3a;--muted:#5c6b7c;--line:#d9e0e8;--accent:#1756a9;--selected:#eaf2ff;--warning:#7b4d09}
@media(prefers-color-scheme:dark){:root{--bg:#151c25;--surface:#1e2835;--text:#e5ecf5;--muted:#a5b4c6;--line:#39495c;--accent:#92bfff;--selected:#263e5c;--warning:#efc281}}
*{box-sizing:border-box}body{margin:0;padding:22px;font:14px/1.5 system-ui,sans-serif;color:var(--text);background:var(--bg)}
header{display:flex;justify-content:space-between;gap:16px;align-items:center}h1{font-size:21px;margin:0}h2{font-size:15px;margin:0 0 14px}p{margin:8px 0;color:var(--muted)}
.badge{font-size:11px;font-weight:700;letter-spacing:.04em;border:1px solid var(--line);border-radius:6px;padding:5px 9px;white-space:nowrap}
#summary{margin:18px 0;padding:12px 16px;background:var(--surface);border:1px solid var(--line);border-radius:8px;font-variant-numeric:tabular-nums}
.layout{display:grid;grid-template-columns:minmax(220px,1fr) minmax(230px,1fr);gap:16px}.panel{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px}
ul{list-style:none;padding-left:18px;margin:0}#tree{padding:0}li{margin:4px 0}.node{width:100%;display:block;text-align:left;border:1px solid transparent;border-radius:6px;padding:8px;color:var(--text);background:transparent;cursor:pointer;font:inherit}.node:hover{border-color:var(--line)}.node[aria-pressed=true]{background:var(--selected);color:var(--accent);border-color:var(--accent)}button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.estimate{display:block;color:var(--muted);font-size:12px}dl{display:grid;grid-template-columns:auto 1fr;gap:7px 12px;margin:0}dt{color:var(--muted)}dd{margin:0;overflow-wrap:anywhere}#warnings{color:var(--warning);padding-left:18px;list-style:disc;margin-top:16px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.6 ui-monospace,monospace;margin-bottom:0}details{margin-top:16px}summary{cursor:pointer}#status{color:var(--muted)}
@media(max-width:600px){body{padding:14px}.layout{grid-template-columns:1fr}header{align-items:flex-start}}
</style>
</head>
<body>
<header><h1>Query plan</h1><span class="badge">ESTIMATES ONLY</span></header>
<p>Explore how PostgreSQL expects to execute this query. The query has not been run.</p>
<div id="summary" role="status">Waiting for an explain result.</div>
<main class="layout">
<section class="panel" aria-labelledby="tree-title"><h2 id="tree-title">Plan tree</h2><p>Choose a node. Use arrow keys to move.</p><ul id="tree" aria-label="Plan nodes"></ul></section>
<section class="panel" aria-labelledby="node-title"><h2 id="node-title">Node details</h2><dl id="details"></dl><ul id="warnings"></ul><details><summary>Selected node JSON</summary><pre id="raw"></pre></details></section>
</main>
<p id="status" role="status"></p>
<!-- APP_SCRIPT -->
</body>
</html>
