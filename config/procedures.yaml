    definition_hash: 6815d32eb07262cab73e06bb4fbdf646118d06d521e3e6164f1e3921fcd19a50
    effects: "Refunds a delivered tenant order; may update payment and order status."
    timeout_seconds: 60
    role: mcp_proc_exec
    transaction_mode: atomic
    parameters:
      - {"name":"p_order_id","type":"bigint","minimum":1,"maximum":9223372036854775000}
      - {"name":"p_amount","type":"numeric","required":false,"default":null,"nullable":true,"minimum":0.01,"maximum":1000000}
      - {"name":"p_reason","type":"text","required":false,"default":"customer request","max_length":500}
  - name: adjust_inventory
    signature: shop.adjust_inventory(smallint,bigint,integer)
    definition_hash: a02ad1395705d9f40de07ed27efc74c0ae14661bd60ace8334ec18d76bedfc8f
    effects: "Changes shared inventory stock and inserts an inventory movement; affects shared stock across tenants."
    timeout_seconds: 60
    role: mcp_proc_exec
    transaction_mode: atomic
    parameters:
      - {"name":"p_warehouse_id","type":"smallint","minimum":1,"maximum":32767}
      - {"name":"p_variant_id","type":"bigint","minimum":1,"maximum":9223372036854775000}
      - {"name":"p_delta","type":"integer","minimum":-1000,"maximum":1000}
  - name: update_customer_email
    signature: shop.update_customer_email(bigint,text)
    definition_hash: 83871b9a840e6b917edbe73e9ddba7e8c3772edf7a7814a5f1a2cfc26a2dc94f
