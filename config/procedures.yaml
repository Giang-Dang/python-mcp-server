version: 1
procedures:
  - name: create_order
    signature: shop.create_order(bigint,bigint[],integer[],bigint)
    definition_hash: 455ca36bc3f19a61c5c601ff3d11620e91fb1f1be594b42e44fa799dd8afae69
    effects: "Creates an order, lines and payment for the configured tenant; triggers reserve stock and add audit rows."
    timeout_seconds: 60
    role: mcp_proc_exec
    transaction_mode: atomic
    parameters:
      - {"name":"p_customer_id","type":"bigint","minimum":1,"maximum":9223372036854775000}
      - {"name":"p_variant_ids","type":"bigint[]","minimum":1,"maximum":9223372036854775000,"max_length":100}
      - {"name":"p_quantities","type":"integer[]","minimum":1,"maximum":1000,"max_length":100}
      - {"name":"p_order_id","type":"bigint","required":false,"default":null,"nullable":true,"server_controlled":true}
  - name: cancel_order
    signature: shop.cancel_order(bigint)
    definition_hash: 298ca8f03d859d945505da27c9950ead9ac62056a034d79aaccb867ec81b271b
    effects: "Cancels one tenant order, releases stock, fails pending payments and adds refunds."
    timeout_seconds: 60
    role: mcp_proc_exec
    transaction_mode: atomic
    parameters:
      - {"name":"p_order_id","type":"bigint","minimum":1,"maximum":9223372036854775000}
  - name: refund_order
