    timeout_seconds: 60
    role: mcp_writer
    transaction_mode: autocommit_batches
    parameters:
      - {"name":"p_before","type":"date"}
      - {"name":"p_batch_size","type":"integer","required":false,"default":5000,"minimum":1,"maximum":5000}
      - {"name":"p_max_batches","type":"integer","required":false,"default":10,"minimum":1,"maximum":10}
  - name: recalc_customer_tiers
