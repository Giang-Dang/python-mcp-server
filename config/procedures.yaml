    timeout_seconds: 60
    role: mcp_proc_exec
    transaction_mode: atomic
    parameters:
      - {"name":"p_order_id","type":"bigint","minimum":1,"maximum":9223372036854775000}
      - {"name":"p_percent","type":"numeric","minimum":0,"maximum":50}
  - name: archive_old_orders
    signature: shop.archive_old_orders(date,integer,integer)
    definition_hash: c5a72128369da77f60460a9971f8e2911946681e61f187928491d37328a05f22
